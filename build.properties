# MTJ Build Properties
KEmulator.includes=res\
,src\

KEmulator.excludes=\

KEmulator 2.includes=src\
,res\

KEmulator 2.excludes=\


# Reproducible Ant packaging (override local SDK paths with -D...)
build.dir=build
tools.src.dir=tools/src
tools.classes.dir=build/tools-classes
desktop.test.classes.dir=build/test-classes
generated.resources.dir=build/generated-resources
resources.stage.dir=build/resources
runtime.resources.dir=runtime-resources
assets.source.dir=res
classes.dir=build/classes
verified.dir=build/verified
dist.jar=micro-x-engine.jar
dist.jad=micro-x-engine.jad
toolchain.jdk.home=/opt/jdk7
wtk.home=/opt/wtk
j2me.javac=${toolchain.jdk.home}/bin/javac
cldc.jar=${wtk.home}/lib/cldcapi11.jar
midp.jar=${wtk.home}/lib/midpapi20.jar
preverify=${wtk.home}/bin/preverify
clang.format=clang-format
debug=false
max.jar.bytes=1048576
gameplay.registry.resource=/data/gameplay/gameplay.txt
