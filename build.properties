# Reproducible CLDC toolchain. Override these paths in a local properties file or
# with -D...; JDK 6/7 is required because current javac releases reject target 1.3.
wtk.home=/opt/wtk
toolchain.jdk.home=/opt/jdk7
j2me.javac=${toolchain.jdk.home}/bin/javac
preverify=${wtk.home}/bin/preverify
midp.jar=${wtk.home}/lib/midpapi20.jar
cldc.jar=${wtk.home}/lib/cldcapi11.jar

build.dir=build
classes.dir=${build.dir}/classes
verified.dir=${build.dir}/verified
tools.src.dir=tools/src
tools.classes.dir=${build.dir}/tools-classes
assets.source.dir=assets-src
generated.resources.dir=${build.dir}/generated-resources
runtime.resources.dir=runtime-resources
resources.stage.dir=${build.dir}/runtime-resources
dist.jar=micro-x-engine.jar
dist.jad=micro-x-engine.jad
max.jar.bytes=1048576
debug=false
desktop.test.classes.dir=${build.dir}/desktop-test-classes
